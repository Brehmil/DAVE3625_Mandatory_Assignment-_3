<!doctype html>
<html lang="en">
<head>
<!--
=====================================================================
 CIRCLES - a hobby-themed social app, all in ONE html file
=====================================================================
 The file has two big parts:
   <style>   the looks (CSS), written in layers - read its guide first
   <script>  the behaviour, split into four sections:
       ICONS       the drawings (hobby, navigation and reaction icons)
       MODELS  M   the data and the rules. Saves to the browser. No HTML here.
       VIEWS   V   functions that turn data into HTML text. They never change data.
       CONTROLLER C  what happens on a click: tell the Model to change the data,
                   then call render() so the View redraws the page.

 The loop that drives everything:
   click -> C.something() -> M changes + saves data -> render() -> V builds HTML -> page updates

 Saved in the browser (localStorage):
   circles-db-v2   users, posts, comments and direct messages
   circles-dark    "1" or "0"  (dark mode on/off)
   circles-skin    aurora | holographic | deep-ocean | classic

 Everything lives in your own browser - there is no shared server, so
 other people on other devices do not see your posts. Passwords are
 hashed (salted SHA-256), but this is a prototype, not a real login system.
=====================================================================
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circles</title>
<style>
/* ---------------------------------------------------------------------
   HOW THE CSS IS LAYERED
   CSS rules further DOWN override earlier ones when they are equally
   specific, so the file is a stack of layers:
     1. Foundation + hobby colours   variables (--bg, --ac ...) per hobby
     2. Base + components            plain layout: header, nav, cards, buttons
     3. Neumorphic layer             soft "pressed / raised" button look and dark mode
     4. Header, messages, files      square header, DM button, bubbles, file picker
     5. Skins                        Aurora / Holographic / Deep Ocean colours
     6. Shared skin rules            how those colours are applied on non-hobby pages
     7. Menu, comments, posts        appearance menu, threaded comments, square posts
     8. Classic fixes                tweaks for the "classic" skin

   WHICH ATTRIBUTES SWITCH THE LOOK (set by render() in the script)
     <body data-theme="swimming|books|...|none">  the hobby being viewed;
            "none" on Popular, Explore, My hobbies, Profile, Messages, login
     <body data-mode="light|dark">                 light or dark mode
     <body data-skin="aurora|holographic|...">     chosen theme (neutral pages only)
     <div data-h="swimming">                       a post/row: gives it its hobby's
            like/dislike colours (--up1/--up2 = like, --dn1/--dn2 = dislike)

   THE ":not(#x)" TRICK
   Writing body:not(#x) adds one "id" worth of priority to a selector, so a
   rule wins over the theme rules without needing !important.
   --------------------------------------------------------------------- */
/* ===== SHARED FOUNDATION: same font, shape and layout on every page ===== */
:root{
  --f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  /* default colours (login screen and Popular page); each hobby overrides them below */
  --bg:#efede8;--card:#fff;--ink:#222;--mut:#6b6b6b;--ac:#3b3b3b;--on:#fff;
  /* default like/dislike colours */
  --up1:#2e9e5b;--up2:#7fd36b;--dn1:#e8742a;--dn2:#f2a45c;--uptx:#fff;--dntx:#fff}

/* ===== HOBBY COLOURS: colours only, nothing else may change per hobby =====
   Line 1 = page palette (header, background, buttons). Line 2 = like/dislike colours on that hobby's posts. */
/* Hobby palettes. Variables: --bg page, --card post background, --ink text, --mut faint text, --ac accent, --on text on the accent. */
[data-theme=swimming]{--bg:#dff1f5;--card:#f8fdff;--ink:#073247;--mut:#4d7a8c;--ac:#0b7fa8;--on:#fff}
[data-h=swimming]{--up1:#1e90ff;--up2:#38d0e8;--dn1:#ff5a47;--dn2:#ff9a62}
[data-theme=books]{--bg:#e7dcc6;--card:#f3ead8;--ink:#1a1714;--mut:#6e5a47;--ac:#4a2f1b;--on:#f3ead8}
[data-h=books]{--up1:#b9791f;--up2:#dcae4e;--dn1:#7a1f2b;--dn2:#b8465a}
[data-theme=gardening]{--bg:#e2ebd6;--card:#f4f8ec;--ink:#1d3320;--mut:#5b7552;--ac:#3f7a38;--on:#fff}
[data-h=gardening]{--up1:#2f9e44;--up2:#8bd450;--dn1:#e8590c;--dn2:#f5a623}
[data-theme=gaming]{--bg:#14102a;--card:#201a40;--ink:#ece8ff;--mut:#9d94d6;--ac:#8f6bff;--on:#14102a}
[data-h=gaming]{--up1:#22d3a0;--up2:#6bff8f;--dn1:#ff3b6b;--dn2:#ff7a45;--uptx:#14102a}
[data-theme=cooking]{--bg:#fbeedf;--card:#fff8ef;--ink:#3a1a10;--mut:#8a5a45;--ac:#b3301c;--on:#fff8ef}
[data-h=cooking]{--up1:#e8590c;--up2:#ffa94d;--dn1:#3b5bdb;--dn2:#74a0ff;--uptx:#3a1a10}
[data-theme=photography]{--bg:#1c1c1c;--card:#262626;--ink:#f0f0f0;--mut:#a0a0a0;--ac:#f2c14e;--on:#1c1c1c}
[data-h=photography]{--up1:#d99a1c;--up2:#f2c14e;--dn1:#4a6fa5;--dn2:#7fa3d1;--uptx:#1c1c1c}
[data-theme=running]{--bg:#fff1e8;--card:#fffaf6;--ink:#2a1608;--mut:#8a5a3a;--ac:#ff5a1f;--on:#fff}
[data-h=running]{--up1:#ff5a1f;--up2:#ffb347;--dn1:#2563eb;--dn2:#60a5fa}
[data-theme=music]{--bg:#1a1024;--card:#2a1a3a;--ink:#f5e9ff;--mut:#b79ad6;--ac:#e040fb;--on:#1a1024}
[data-h=music]{--up1:#e040fb;--up2:#ff80ab;--dn1:#00a8c0;--dn2:#4dd0e1}
[data-theme=painting]{--bg:#fdf6ee;--card:#fff;--ink:#2a2133;--mut:#7d6b8a;--ac:#e0457b;--on:#fff}
[data-h=painting]{--up1:#e0457b;--up2:#f5a623;--dn1:#2f9e98;--dn2:#2a7de1}
[data-theme=hiking]{--bg:#e9eadc;--card:#f6f6ec;--ink:#25301c;--mut:#6d7a5a;--ac:#6b4f2a;--on:#f6f6ec}
[data-h=hiking]{--up1:#4a8f3a;--up2:#9ccc65;--dn1:#8d5a2b;--dn2:#c98f4a}
[data-theme=cycling]{--bg:#e8f0f7;--card:#f7fbff;--ink:#10243a;--mut:#587490;--ac:#1769c9;--on:#fff}
[data-h=cycling]{--up1:#1769c9;--up2:#42a5f5;--dn1:#ef6c00;--dn2:#ffb300}
[data-theme=yoga]{--bg:#f1ebf5;--card:#fbf8fd;--ink:#3a2d4a;--mut:#8a7b9c;--ac:#8e6bbf;--on:#fff}
[data-h=yoga]{--up1:#8e6bbf;--up2:#d1a5ec;--dn1:#e08a6b;--dn2:#f4b183}
[data-theme=fishing]{--bg:#dfe9ea;--card:#f1f7f7;--ink:#14302f;--mut:#547572;--ac:#1f6f6b;--on:#fff}
[data-h=fishing]{--up1:#1f8f86;--up2:#5fd1bd;--dn1:#d9534f;--dn2:#f08a5d}
[data-theme=knitting]{--bg:#f6e9ea;--card:#fff6f6;--ink:#4a1d2c;--mut:#9a6a77;--ac:#c2415d;--on:#fff}
[data-h=knitting]{--up1:#c2415d;--up2:#ef8aa0;--dn1:#4b6cb7;--dn2:#8fa8e8}
[data-theme=chess]{--bg:#d9d4cc;--card:#efece6;--ink:#111;--mut:#5b564e;--ac:#111;--on:#efece6}
[data-h=chess]{--up1:#3d3d3d;--up2:#7a7a7a;--dn1:#c9a227;--dn2:#f0d56a;--dntx:#111}
[data-theme=astronomy]{--bg:#0b1026;--card:#151c3d;--ink:#e6ebff;--mut:#8d9bd1;--ac:#ffd166;--on:#0b1026}
[data-h=astronomy]{--up1:#ffd166;--up2:#ffe9a3;--dn1:#7b61ff;--dn2:#b39dff;--uptx:#0b1026}

/* ===== BASE ===== */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
button,input,textarea{font:inherit}
body{--line:color-mix(in srgb,var(--ink) 18%,transparent);background:var(--bg);color:var(--ink);font-family:var(--f);transition:background .3s,color .3s}
header{background:var(--ac);color:var(--on);padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{margin:0;font-size:1.4rem}
main{padding:16px 16px 120px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
nav button{display:flex;align-items:center;justify-content:center;width:48px;height:48px;pointer-events:auto;border:0;border-radius:14px;background:var(--card);color:var(--mut);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
nav button.on{background:var(--ac);color:var(--on)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hico{opacity:.9;flex:none}.ico{flex:none;color:var(--ac)}

/* ===== COMPONENTS ===== */
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.card img.ph{width:100%;border-radius:calc(var(--r) / 2);display:block;margin-top:8px}
.meta{color:var(--mut);font-size:.8rem}
textarea,input[type=text],input[type=password]{width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:calc(var(--r) / 2);padding:10px;margin-bottom:8px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:calc(var(--r) / 2);padding:10px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--mut);padding:4px 6px;font-size:.8rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name,.who{display:flex;align-items:center;gap:12px}.who{cursor:pointer}
.name h2{margin:0}
.empty{color:var(--mut);text-align:center;padding:32px 8px}
.tog{display:flex;gap:8px;margin-bottom:12px}
.tog .btn{flex:1;background:none;color:var(--ac);border:1px solid var(--ac)}.tog .btn.on{background:var(--ac);color:var(--on)}
.av{border-radius:50%;object-fit:cover;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.cm{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.cm p{margin:6px 0}.faded{opacity:.5}
.auth{margin:12vh auto 0;max-width:360px}.err{color:#c0392b}
/* .toast = small message at the bottom of the screen (replaces the native alert pop-ups) */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:min(90vw,380px);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:14px;font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:1000;text-align:center}

/* ===== POST ACTIONS (like / dislike / comment / hide) ===== */
.acts{display:flex;align-items:flex-end;gap:4px;margin-top:10px;flex-wrap:wrap}
.acts button{display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;background:none;border:1px solid var(--line);border-radius:50%;color:var(--mut);cursor:pointer}
.acts button .ri{width:20px;height:20px}
.cb{display:inline-flex;flex-direction:column;align-items:center;gap:3px}   /* one reaction = number on top, round button below */
.cn{font-size:.85rem;line-height:1;font-weight:800;color:var(--mut)}
.acts>.cb .cn{font-size:.78rem}
.cb:has(button.up) .cn{color:var(--up1)}
.cb:has(button.dn) .cn{color:var(--dn1)}
.cn[data-n="0"],.cn[data-n=""]{visibility:hidden}   /* zero counts stay invisible but keep their space */
.cact{margin-top:6px}                                 /* the same row, but under a comment: smaller */
.cact button{width:30px;height:30px}
.cact button .ri{width:15px;height:15px}
.acts button.on{color:var(--on);background:var(--ac);border-color:var(--ac)}
.acts button.up{--c1:var(--up1);--c2:var(--up2);--tx:var(--uptx)}
.acts button.dn{--c1:var(--dn1);--c2:var(--dn2);--tx:var(--dntx)}
.acts button.up,.acts button.dn{color:var(--c1);border-color:color-mix(in srgb,var(--c1) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 16%,transparent),color-mix(in srgb,var(--c2) 16%,transparent))}
.acts button.up.on,.acts button.dn.on{color:var(--tx);border-color:transparent;background:linear-gradient(135deg,var(--c1),var(--c2))}

/* ===== VARIANT: Neumorphic buttons + Tonal posts, with dark/light mode ===== */
:root{--r:28px;--f:Roboto,"Google Sans","Segoe UI",system-ui,-apple-system,sans-serif;--ac:#6c63ff;--on:#fff}
/* both modes are derived from each hobby's accent colour */
/* Light and dark mode: both are generated from each hobby's accent colour (--ac) mixed with white or near-black.
   --acx is the accent as used on screen (lightened in dark mode); --k controls how strong the soft shadows are.
*/
body[data-mode=light]{--acx:var(--ac);--bg:color-mix(in srgb,var(--ac) 13%,#f6f5f2);--card:color-mix(in srgb,var(--ac) 5%,#fff);--ink:#1a1b20;--mut:#666a76;--k:.14}
body[data-mode=dark]{--acx:color-mix(in srgb,var(--ac) 50%,#fff);--bg:color-mix(in srgb,var(--ac) 14%,#0e0f13);--card:color-mix(in srgb,var(--ac) 18%,#14161b);--ink:#eceef3;--mut:#9a9eac;--on:#0e0f13;--k:.085}
/* Neumorphism: every raised button has TWO shadows, a dark one (--sd) down-right and a light one (--sl) up-left.
   --raise / --small = sticking out, --press = pushed in.
*/
body{--surf:var(--bg);--tone:color-mix(in srgb,var(--acx) 11%,var(--bg));--tone2:color-mix(in srgb,var(--acx) 21%,var(--bg));
 --sd:oklch(from var(--bg) calc(l - var(--k)) c h);--sl:oklch(from var(--bg) calc(l + var(--k)) c h);
 --raise:7px 7px 16px var(--sd),-7px -7px 16px var(--sl);--small:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);--press:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl)}
/* inside a post the surface is the tone colour, so button shadows are recomputed from it */
.card{--surf:var(--tone);--sd:oklch(from var(--tone) calc(l - var(--k)) c h);--sl:oklch(from var(--tone) calc(l + var(--k)) c h);
 --small:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);--press:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl)}
.ico,.hico,.ni,.ri{stroke-width:1.8}
.ico{color:var(--acx)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline-color:var(--acx)}

/* posts: tonal bento */
header{background:var(--acx);color:var(--on);border-radius:0 0 40px 40px;padding-bottom:24px}
.card{background:var(--tone);box-shadow:none;border:0}
.card img.ph{border-radius:20px}
.av{background:var(--tone2);color:var(--acx);box-shadow:none}
textarea,input[type=text],input[type=password]{background:var(--tone2);border:0;border-bottom:2px solid var(--acx);border-radius:16px 16px 4px 4px;padding:12px 14px;box-shadow:none;color:var(--ink)}

/* buttons: neumorphic */
nav button{background:var(--bg);color:var(--mut);box-shadow:var(--small);border-radius:18px}
nav button.on{background:var(--bg);color:var(--acx);box-shadow:var(--press)}
.btn{background:var(--surf);color:var(--acx);font-weight:700;border-radius:16px;box-shadow:var(--small)}
.btn:active{box-shadow:var(--press)}
.btn.ghost{background:none;box-shadow:none;color:var(--mut)}
.tog .btn{border:0;color:var(--mut)}
.tog .btn.on{background:var(--surf);color:var(--acx);box-shadow:var(--press)}
.acts button{border:0;background-color:var(--surf);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl)}
.acts button.on:not(.up):not(.dn){background:var(--surf);color:var(--acx);box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
body[data-mode=dark] .acts button.up:not(.on),body[data-mode=dark] .acts button.dn:not(.on){color:color-mix(in srgb,var(--c1) 60%,#fff)}

body[data-mode=dark] header{background:color-mix(in srgb,var(--ac) 42%,#14151b);color:var(--ink)}

/* Header buttons (DM, + , appearance, join/leave): a square with a translucent version of the header's own text colour. */
/* ===== v2: square header, icon left, DM button, file picker, messages ===== */
header{border-radius:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px}
.hl{display:flex;align-items:center;gap:12px;min-width:0}
header h1{font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hico{opacity:1;flex:none}
/* .dmbtn is the shared style for ALL square header buttons, not only messages. */
.dmbtn{position:relative;flex:none;width:44px;height:44px;border:0;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:inherit;background:color-mix(in srgb,currentColor 16%,transparent)}
.dmbtn.on{background:color-mix(in srgb,currentColor 30%,transparent);box-shadow:inset 0 0 0 2px currentColor}
.dmbtn:active{transform:scale(.96)}
.hr{display:flex;gap:6px;flex:none}
.hr .dmbtn{width:42px;height:42px}
/* .badge = the red unread counter on the DM button (.badge.in is the same thing inside a conversation row). */
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff4d4f;color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.badge.in{position:static;margin-top:4px;margin-left:auto}
/* file picker */
input[type=file]{width:100%;color:var(--mut);font-size:.85rem;padding:8px;border:0;border-radius:16px;background:var(--tone2);margin-bottom:8px}
input[type=file]::file-selector-button{margin-right:12px;border:0;border-radius:12px;padding:9px 14px;background:var(--surf);color:var(--acx);font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--small)}
input[type=file]::file-selector-button:active{box-shadow:var(--press)}
/* messages */
.convo{cursor:pointer}.cv{min-width:0}.cr{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end}
.cut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.pick{padding:8px 0}
.btn{white-space:nowrap}
.row>h2{margin:0;font-size:1.2rem}
.msgs{display:flex;flex-direction:column;gap:6px;margin:12px 0}
/* Chat bubbles in a direct-message conversation: .me = yours (right), .them = theirs (left). */
.bub{max-width:80%;padding:10px 14px;border-radius:20px;line-height:1.35;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--acx);color:var(--on);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--tone);border-bottom-left-radius:6px}
.bt{font-size:.68rem;opacity:.7;margin-top:2px}
.dmcomp{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.dmcomp input{flex:1;margin:0}

/* ===== THEMES ===== */
/* Skins. Two lines per skin (light + dark). Each line sets the same 20 variables that the shared rules below read:
     --bg page colour   --card post colour   --ink text   --mut faint text   --acx accent
     --bon text on gradient buttons   --hon text on the header
     --mesh page background (soft coloured blobs)   --hdr header background   --hfx glossy overlay on the header
     --cbg / --cbd / --csh / --cblur   card background, border, shadow, blur ("glass" effect)
     --grad main gradient (buttons, avatars, active nav)   --tgrad gradient used for heading text
     --navb / --navbd / --navsh   nav button background, border, shadow   --glow glow on the active nav button
   Optional extras a skin may add (each has a fallback below): --deco, --hsh, --hls, --htt, --hf, --hts, --cr, --btnsh.
   To make a new skin: copy two lines, change the name in [data-skin=...] and the colours, and add it to SKINS in the script.
*/
body[data-theme=none][data-skin=aurora][data-mode=light]{--bg:#eef3fb;--card:#fff;--ink:#16183a;--mut:#5c6288;--acx:#5b6cff;--bon:#fff;--hon:#fff;--mesh:radial-gradient(60% 45% at 0% 0%,#8ef0d8 0,transparent 70%),radial-gradient(55% 45% at 100% 10%,#b9a6ff 0,transparent 70%),radial-gradient(60% 50% at 80% 100%,#ffb6dd 0,transparent 70%),radial-gradient(50% 40% at 0% 90%,#9fd4ff 0,transparent 70%),#f3f7fb;--hdr:linear-gradient(110deg,#10b8a3,#5b6cff 55%,#c04dff);--hfx:radial-gradient(60% 140% at 85% -30%,rgba(255,255,255,.5),transparent 60%);--cbg:rgba(255,255,255,.55);--cbd:1px solid rgba(255,255,255,.75);--csh:0 10px 34px -12px rgba(91,108,255,.35);--cblur:blur(18px) saturate(160%);--grad:linear-gradient(120deg,#10b8a3,#5b6cff,#c04dff);--tgrad:linear-gradient(120deg,#0a8f80,#4b5cf0,#a233e0);--navb:rgba(255,255,255,.6);--navbd:rgba(255,255,255,.8);--navsh:0 8px 20px -8px rgba(91,108,255,.45);--glow:0 10px 24px -6px rgba(91,108,255,.7);}

/* ===== stunning non-themed pages (Popular, Explore, My hobbies, Profile, Messages, login) ===== */
/* Skin rules shared by every skin on the neutral pages. They read the variables defined just above.
   .chip = the little coloured square with the hobby icon in the hobby lists.
*/
.chip{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--up1),var(--up2));color:var(--uptx,#fff);box-shadow:0 8px 16px -8px var(--up1)}
/* Page background, header, cards, buttons, nav, avatars, chat bubbles: all coloured from the skin's variables. */
body[data-theme=none]:not([data-skin=classic]){background:var(--mesh);background-attachment:fixed;min-height:100vh}
body[data-theme=none]:not([data-skin=classic]) header{background:var(--hdr);color:var(--hon);position:relative;overflow:hidden;box-shadow:var(--hsh,0 12px 30px -14px rgba(0,0,0,.45))}
body[data-theme=none]:not([data-skin=classic]) header::before{content:"";position:absolute;inset:0;background:var(--hfx,none);pointer-events:none}
body[data-theme=none]:not([data-skin=classic]) header>*{position:relative}
body[data-theme=none]:not([data-skin=classic]) header h1{letter-spacing:var(--hls,0);text-transform:var(--htt,none);font-family:var(--hf,inherit);text-shadow:var(--hts,none)}
body[data-theme=none]:not([data-skin=classic]) .card{position:relative;overflow:hidden;background:var(--cbg);border:var(--cbd);box-shadow:var(--csh);backdrop-filter:var(--cblur,none);-webkit-backdrop-filter:var(--cblur,none);border-radius:var(--cr,var(--r))}
/* Posts get a tint of their hobby colour and a 5px stripe down the left edge (the ::before element). */
body[data-theme=none]:not([data-skin=classic]) .card[data-h]:not(.row){padding-left:19px;background:radial-gradient(90% 70% at 100% 0%,color-mix(in srgb,var(--up1) 16%,transparent),transparent 65%),var(--cbg)}
body[data-theme=none]:not([data-skin=classic]) .card[data-h]:not(.row)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--up1),var(--up2))}
/* .pcard = the profile card with a gradient banner behind the avatar. */
body[data-theme=none]:not([data-skin=classic]) .pcard{padding-top:14px}
body[data-theme=none]:not([data-skin=classic]) .pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:92px;background:var(--grad)}
body[data-theme=none]:not([data-skin=classic]) .pcard>*{position:relative}
body[data-theme=none]:not([data-skin=classic]) .pcard .name{margin-top:52px;align-items:flex-end}
body[data-theme=none]:not([data-skin=classic]) .pcard .av{border:4px solid var(--bg)}
body[data-theme=none]:not([data-skin=classic]) main h2,body[data-theme=none]:not([data-skin=classic]) .auth h1{background:var(--tgrad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;font-family:var(--hf,inherit)}
body[data-theme=none]:not([data-skin=classic]) .auth h1{font-size:2.3rem}
body[data-theme=none]:not([data-skin=classic]) .btn{background:var(--grad);color:var(--bon);box-shadow:var(--btnsh,0 8px 20px -8px rgba(0,0,0,.45));font-weight:700;border-radius:14px}
body[data-theme=none]:not([data-skin=classic]) .btn:active{transform:translateY(1px);box-shadow:none}
body[data-theme=none]:not([data-skin=classic]) .btn.ghost,body[data-theme=none]:not([data-skin=classic]) .tog .btn:not(.on){background:none;box-shadow:none;color:var(--mut)}
body[data-theme=none]:not([data-skin=classic]) nav button{background:var(--navb);border:1px solid var(--navbd);box-shadow:var(--navsh);color:var(--mut);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body[data-theme=none]:not([data-skin=classic]) nav button.on{background:var(--grad);color:var(--bon);border-color:transparent;box-shadow:var(--glow)}
body[data-theme=none]:not([data-skin=classic]) .av{background:var(--grad);color:var(--bon);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
body[data-theme=none]:not([data-skin=classic]) .acts button{background-color:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:none;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
body[data-theme=none]:not([data-skin=classic]) .bub.me{background:var(--grad);color:var(--bon)}
body[data-theme=none]:not([data-skin=classic]) .bub.them{background:var(--cbg);border:var(--cbd);backdrop-filter:var(--cblur,none);-webkit-backdrop-filter:var(--cblur,none)}
body[data-theme=none]:not([data-skin=classic])[data-mode=light] .dmbtn{background:rgba(255,255,255,.34)}
body[data-theme=none]:not([data-skin=classic])[data-mode=dark] .dmbtn{background:rgba(255,255,255,.16)}
body[data-theme=none]:not([data-skin=classic]) .dmbtn.on{background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 2px currentColor}
body[data-theme=none]:not([data-skin=classic])::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--deco,none)}

/* .authstyle = the appearance button floating top-right on the login screen (there is no header there).
   .skinmenu = the dropdown with the Light/Dark switch and the theme list (.seg = the switch, .skinopt = one theme row).
*/
/* ===== theme button + menu ===== */
.authstyle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:5;color:var(--acx)}
.authstyle .dmbtn{background:var(--card,rgba(255,255,255,.5));box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.skinback{position:fixed;inset:0;z-index:29}
.skinmenu{position:fixed;z-index:30;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);width:min(280px,calc(100vw - 24px));padding:10px;border-radius:24px;background:var(--card);color:var(--ink);box-shadow:0 18px 44px -10px rgba(0,0,0,.5),0 0 0 1px rgba(128,128,160,.25);display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(18px)}
.skinmenu .seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:rgba(128,128,160,.16);margin-bottom:6px}
.skinmenu .seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--mut);padding:9px 6px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer}
.skinmenu .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.35)}
.skinmenu .seg .ico{width:18px;height:18px}
.skinhint{font-size:.72rem;color:var(--mut);padding:4px 10px 8px;line-height:1.3}
.skinopt{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:16px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.skinopt:hover{background:rgba(128,128,160,.14)}
.skinopt.on{background:rgba(128,128,160,.22)}
.skinopt .sw{width:30px;height:30px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 4px 10px -4px rgba(0,0,0,.4)}
.skinopt .ck{margin-left:auto;color:var(--acx)}
.dmsearch{width:100%;margin:10px 0 6px}
#dmres{max-height:46vh;overflow:auto}

/* Comments. Each comment is a .cmt; replies are .cmt inside .cmt, indented with a line in the hobby colour.
   After 3 levels (.flat) the indent stops so replies don't get squeezed on a phone.
*/
/* ===== threaded comments ===== */
/* .cmh = comment header (avatar, name, time). */
.cmt{margin:10px 0 0}
.cmt .cmt{margin-left:12px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--up1,var(--ac)) 45%,transparent)}
.cmt .cmt.flat{margin-left:0}
.cmh{display:flex;align-items:center;gap:8px}
.cmt>p{margin:4px 0 0}

/* .composer = the single comment box under a post. When you press reply on a comment it shows "Replying to ..." (.replying) above the field. */
.composer{margin-top:12px}
.cin{display:flex;align-items:center;gap:4px}
.cin input[type=text]{flex:1;min-width:0;margin:0;padding:7px 14px;font-size:.88rem;border-radius:999px;background:color-mix(in srgb,var(--ink,#000) 4%,transparent);border:1px solid color-mix(in srgb,var(--ink,#000) 12%,transparent);box-shadow:none;color:var(--ink)}
.cin input[type=text]::placeholder{color:var(--mut);opacity:.8}
.sendbtn{flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--acx,var(--ac));cursor:pointer}
.sendbtn:hover{background:color-mix(in srgb,var(--acx,var(--ac)) 14%,transparent)}
.sendbtn:active{transform:scale(.92)}
.replying{display:flex;align-items:center;justify-content:space-between;font-size:.78rem;color:var(--mut);padding:0 6px 6px}
.replying button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:8px}

/* ===== posts are angular (no rounded corners) =====
   `:not(#x)` adds an id's worth of specificity so these win over the theme rules above without !important */
body:not(#x) .card[data-h]:not(.row){border-radius:0}
body:not(#x) .card[data-h]:not(.row) img.ph{border-radius:0}
body:not(#x) .card[data-h]:not(.row)::before{border-radius:0}

/* ===== account deletion / destructive buttons ===== */
/* Delete-account area in "Edit profile". */
.danger{margin-top:18px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--ink,#000) 14%,transparent)}
.danger p{margin:0 0 10px}
body:not(#x) .dangerlink{color:#d93a3a}
body:not(#x) .danger-btn{background:#d93a3a;color:#fff;box-shadow:none}

/* hobby icon next to the poster's name: no background, drawn in the hobby colour, clickable */
.nm{display:flex;align-items:center;gap:6px}
.hbadge{display:inline-grid;place-items:center;flex:none;background:none;border:0;padding:0;margin:0;color:var(--up1);cursor:pointer;transition:transform .12s}
.hbadge svg{width:30px;height:30px;color:inherit}
body[data-mode=dark] .hbadge{color:color-mix(in srgb,var(--up1) 62%,#fff)}   /* lighter in dark mode so dark colours (chess) stay visible */
.hbadge:hover{transform:scale(1.12)}.hbadge:active{transform:scale(.94)}

/* Classic skin on neutral pages: it keeps the old neumorphic look, but the reaction buttons are flat like the other skins. */
/* classic on neutral pages: flat reaction buttons like the other themes */
body[data-theme=none][data-skin=classic] .acts button{background-color:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:none;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
body[data-theme=none][data-skin=classic] .acts button.on:not(.up):not(.dn){background-color:color-mix(in srgb,var(--acx) 16%,transparent);color:var(--acx);box-shadow:none}

/* classic posts: thin divider + the hobby colour stripe on the left edge */
body[data-theme=none][data-skin=classic] .card[data-h]:not(.row){box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent);position:relative;overflow:hidden;padding-left:19px}
body[data-theme=none][data-skin=classic] .card[data-h]:not(.row)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--up1),var(--up2))}
body:not(#x) .dmbtn.leavebtn.confirm{background:#d93a3a;color:#fff;box-shadow:none}

/* classic profile card: same size and layout as the other skins (banner behind the avatar), banner coloured from the accent */
body[data-theme=none][data-skin=classic] .pcard{position:relative;overflow:hidden;padding-top:14px;border:1px solid transparent}
body[data-theme=none][data-skin=classic] .pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:92px;background:linear-gradient(135deg,color-mix(in srgb,var(--acx) 80%,#000),var(--acx) 55%,color-mix(in srgb,var(--acx) 55%,#fff))}
body[data-theme=none][data-skin=classic] .pcard>*{position:relative}
body[data-theme=none][data-skin=classic] .pcard .name{margin-top:52px;align-items:flex-end}
body[data-theme=none][data-skin=classic] .pcard .av{border:4px solid var(--bg)}

/* classic cards get the same invisible 1px border the other skins have, so every card (profile, edit form, hobby rows, messages) ends up exactly the same size */
body[data-theme=none][data-skin=classic] .card{border:1px solid transparent}

/* classic: headings and chat bubbles take exactly the same space as in the other skins
   (the other skins make headings inline-block for their gradient text, which changes the spacing around them) */
body[data-theme=none][data-skin=classic] main h2{display:inline-block}
body[data-theme=none][data-skin=classic] .bub.them{border:1px solid transparent}
</style>

// MODEL: the data and the rules. Nothing in here makes HTML.
// The whole database is one object, `db`, saved as JSON in localStorage:
//   db.session   id of the logged-in user (or null)
//   db.users     {id, name, bio, pic, salt, hash, joined:[hobbies], current:hobby being viewed, hidden:[post ids]}
//   db.posts     {id, hobby, uid, text, img, t:time, votes:{userId: 1 or -1}}

// MODEL: data, rules and saving (localStorage). Contains no HTML.
const M=(()=>{
// localStorage key for the database. Change it to start with a fresh, empty database.
const KEY="circles-db-v2";
// H: the hobbies. The key (swimming...) must match the icon names, the [data-theme] and [data-h] CSS and REACT.
// "tag" taglines are not shown anywhere at the moment - kept in case you want them back.

  swimming:{name:"Swimming",tag:"Laps, open water and cold-lake bravery."},
  books:{name:"Books",tag:"What you’re reading and what it did to you."},
  gardening:{name:"Gardening",tag:"Seeds, soil and slow wins."},
  gaming:{name:"Gaming",tag:"Runs, builds and rage-quits."},
  cooking:{name:"Cooking",tag:"Dinners worth photographing."},
  photography:{name:"Photography",tag:"One good frame at a time."},
  running:{name:"Running",tag:"Early miles and personal bests."},
  music:{name:"Music",tag:"Play it, make it, share it."},
  painting:{name:"Painting",tag:"Colour, canvas and happy accidents."},
  hiking:{name:"Hiking",tag:"Trails, summits and snack breaks."},
  cycling:{name:"Cycling",tag:"Two wheels, long roads."},
  yoga:{name:"Yoga",tag:"Stretch, breathe, repeat."},
  fishing:{name:"Fishing",tag:"Patience, water and the one that got away."},
  knitting:{name:"Knitting",tag:"One more row, always."},
  chess:{name:"Chess",tag:"Openings, endgames and blunders."},
  astronomy:{name:"Astronomy",tag:"Clear skies and faraway things."}};
// db is loaded below (or created from seed()).
let db=null;
// uid("p") makes a unique id such as "p1k3x9a" (a prefix, the current time and a random part).
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// save(): write db to localStorage. If the browser storage is full (big photos), tell the user.
// toast(msg): shows a short message at the bottom of the screen for a few seconds. Used instead of alert(), so it also works in browsers that block pop-ups and doesn't re-render (typed text stays).
window.toast=function(msg){document.querySelectorAll(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","alert");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Storage is full. Delete a photo post to free up space.")}};
// hash(): salted SHA-256 of the password, so the real password is never stored. Needs https or localhost (crypto.subtle).
async function hash(pw,salt){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
// seed(): the demo data used the very first time: no users, posts, comments or messages. These demo users have no password, so nobody can log in as them.
function seed(){
  const n=Date.now(),m=6e4,u=(id,name,bio,joined)=>({id,name,bio,pic:null,salt:null,hash:null,joined,current:null,hidden:[]});
  const p=(id,hobby,who,text,ago,votes)=>({id,hobby,uid:who,text,img:null,t:n-ago*m,votes});
  return{session:null,
    users:[],
    posts:[],
    comments:[],
    dms:[]}}
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db){db=seed();save()}
if(!db.dms){db.dms=[];save()}
// One-time clean-up: the first time this version opens, delete all accounts, posts, comments and messages already saved in this browser (and all accounts, logging everyone out).
try{if(!localStorage.getItem("circles-cleared-2")){db.users=[];db.posts=[];db.comments=[];db.dms=[];db.session=null;save();localStorage.setItem("circles-cleared-2","1")}}catch(e){}
// Small lookup helpers used below: user(id), me() = logged-in user, post(id), count(hobby) = posts, members(hobby) = members.
const user=i=>db.users.find(x=>x.id===i);
const me=()=>user(db.session);
const post=i=>db.posts.find(p=>p.id===i);
const count=h=>db.posts.filter(p=>p.hobby===h).length;
const members=h=>db.users.filter(x=>x.joined.includes(h)).length;
// Everything below is the public API of the model, used as M.something() from the View and Controller.
return{H,user,me,post,members,count,
  // --- accounts ---
  // signUp: checks name/password length and that the name is free, creates the user, adds a welcome DM and logs in. Returns an error text, or null when it worked.
  async signUp(name,pw){
    name=name.trim();
    if(name.length<2||pw.length<4)return"Use a name of 2+ characters and a password of 4+.";
    if(db.users.some(x=>x.name.toLowerCase()===name.toLowerCase()))return"That name is taken.";
    const salt=uid("s"),u={id:uid("u"),name,bio:"",pic:null,salt,hash:await hash(pw,salt),joined:[],current:null,hidden:[]};
    db.users.push(u);db.session=u.id;save();return null},
  // logIn: finds the user by name and compares password hashes. Returns an error text or null.
  async logIn(name,pw){
    const u=db.users.find(x=>x.hash&&x.name.toLowerCase()===name.trim().toLowerCase());
    if(!u||u.hash!==await hash(pw,u.salt))return"Wrong name or password.";
    db.session=u.id;save();return null},
  logout(){db.session=null;save()},
  // deleteAccount: checks the password, then removes the user, their posts, their comments (and every reply under removed comments), their votes and their DMs.
  async deleteAccount(pw){const u=me();if(!u)return"Not logged in.";if(!pw)return"Enter your password to confirm.";if(await hash(pw,u.salt)!==u.hash)return"Wrong password.";
    const id=u.id,mine=new Set(db.posts.filter(p=>p.uid===id).map(p=>p.id));
    db.posts=db.posts.filter(p=>p.uid!==id);
    const gone=new Set(db.comments.filter(c=>c.uid===id||mine.has(c.pid)).map(c=>c.id));let ch=true;
    while(ch){ch=false;db.comments.forEach(c=>{if(!gone.has(c.id)&&c.parent&&gone.has(c.parent)){gone.add(c.id);ch=true}})}
    db.comments=db.comments.filter(c=>!gone.has(c.id));
    db.posts.forEach(p=>{delete p.votes[id]});db.comments.forEach(c=>{if(c.votes)delete c.votes[id]});
    db.dms=db.dms.filter(d=>d.from!==id&&d.to!==id);
    db.users=db.users.filter(x=>x.id!==id);db.session=null;save();return null},
  // update: change name / bio / picture of the logged-in user. Names must be 2+ characters and unique.
  update(patch){
    if(patch.name!==undefined){const nm=patch.name.trim();
      if(nm.length<2)return"Name needs 2+ characters.";
      if(db.users.some(x=>x.id!==db.session&&x.name.toLowerCase()===nm.toLowerCase()))return"That name is taken.";

  // --- direct messages ---

  others(){return db.users.filter(x=>x.id!==db.session)},
  // convos(): one entry per person I have chatted with: the other user, the latest message and the unread count, newest conversation first.
  convos(){const me=db.session,g={};
    db.dms.filter(d=>d.from===me||d.to===me).forEach(d=>{const o=d.from===me?d.to:d.from;(g[o]=g[o]||[]).push(d)});
    return Object.entries(g).map(([o,l])=>{l.sort((a,b)=>a.t-b.t);return{other:user(o),last:l[l.length-1],unread:l.filter(d=>d.to===me&&!d.seen).length}}).filter(c=>c.other).sort((a,b)=>b.last.t-a.last.t)},
  // thread(o): all messages between me and user o, oldest first.
  thread(o){const me=db.session;return db.dms.filter(d=>(d.from===me&&d.to===o)||(d.from===o&&d.to===me)).sort((a,b)=>a.t-b.t)},
  sendDm(o,text){db.dms.push({id:uid("d"),from:db.session,to:o,text,t:Date.now(),seen:false});save()},
  // markSeen: marks messages from o as read (only writes if something changed).
  markSeen(o){let c=false;db.dms.forEach(d=>{if(d.to===db.session&&d.from===o&&!d.seen){d.seen=true;c=true}});if(c)save()},
  unread(){return db.dms.filter(d=>d.to===db.session&&!d.seen).length},
  // --- hobbies: most popular first (members, then posts) ---
  popular(list){return list.slice().sort((a,b)=>members(b)-members(a)||count(b)-count(a))},
  // join: add hobby h to my list and make it the one I am viewing.
  join(h){const u=me();if(!u.joined.includes(h))u.joined.push(h);u.current=h;save()},
  // setCurrent: view hobby h without joining it.
  setCurrent(h){me().current=h;save()},
  // leaveKeep: leave hobby h but keep viewing it (used by the broken-heart button in the header).
  leaveKeep(h){const u=me();u.joined=u.joined.filter(x=>x!==h);save()},
  // leave: leave hobby h; if I was viewing it, switch to my first remaining hobby (used by the list in "My hobbies").
  leave(h){const u=me();u.joined=u.joined.filter(x=>x!==h);if(u.current===h)u.current=u.joined[0]||null;save()},
  // popularPosts: ALL posts ranked by (likes - dislikes), then number of comments, then newest. The page shows the top 30 and hides posts I hid.
  // all posts ranked by likes minus dislikes, then comments, then newest (the view hides hidden ones and keeps the top 30)
  popularPosts(){const sc=p=>Object.values(p.votes).reduce((a,b)=>a+b,0),nc=p=>db.comments.filter(c=>c.pid===p.id).length;
    return db.posts.slice().sort((a,b)=>sc(b)-sc(a)||nc(b)-nc(a)||b.t-a.t)},
  // --- posts: newest first ---

    const all=(S.order||[]).map(M.post).filter(Boolean),hn=all.filter(p=>u.hidden.includes(p.id)).length;
    const l=all.filter(p=>S.showHidden||!u.hidden.includes(p.id)).slice(0,30);
    return(l.length?l.map(p=>V.card(p,S,u,true)).join(""):`<div class="empty">Nothing here yet.</div>`)+V.hiddenBtn(S,hn)},
  // page: chooses which view to draw for the current tab (S.tab).
  page(S,u){return({popular:()=>V.popular(S,u),photos:()=>V.feed(S,u,true),text:()=>V.feed(S,u,false),compose:()=>V.compose(S),add:()=>V.explore(u),hobbies:()=>V.mine(u,S),me:()=>V.profile(S,u),dms:()=>V.dms(S,u),thread:()=>V.thread(S,u)})[S.tab]()}
};

// CONTROLLER: reacts to clicks. Every function changes the Model and/or the UI state S, then calls render().
// ===== CONTROLLER =====
// CONTROLLER: handles clicks, asks the Model to change data, then redraws the View.
const C=(()=>{
// Tabs that do NOT take on a hobby's colours (they use the skin instead).
const NEUTRAL_TABS=["popular","add","me","hobbies","dms","thread"]; // pages that keep the basic colours
// S = UI state (not saved, except dark and skin which are read from localStorage on load):
//   tab        current page: popular | photos | text | add | hobbies | me | dms | thread | compose
//   dark, skin appearance      skinOpen   appearance menu open
//   mode, err  login form ("in"/"up") and its error text
//   open       {postId:true} posts whose comments are open
//   replying   id of the comment the next comment will answer (null = new top-level comment)
//   folded     {commentId:true} collapsed reply threads       cscore  frozen comment order per post
//   order      frozen Popular order                           showHidden / showAllHidden  hidden-post toggles
//   draft      post being written or edited                    editing / pic   profile editing
//   confirmDel / delErr / delPost / leaving   the "are you sure?" steps for deleting and leaving
//   dmWith / picking   open conversation, "new message" search open
//   viewUid    whose profile is shown (null = mine)
const S={skinOpen:false,skin:(()=>{try{const v=localStorage.getItem("circles-skin");return SKINS.some(x=>x.id===v)?v:"aurora"}catch(e){return"aurora"}})(),dmWith:null,picking:false,dark:(()=>{try{const v=localStorage.getItem("circles-dark");return v===null?matchMedia("(prefers-color-scheme: dark)").matches:v==="1"}catch(e){return false}})(),editing:false,showAllHidden:false,order:null,tab:"text",mode:"in",err:"",open:{},showHidden:false,viewUid:null,draft:null,back:"text",pic:null};
// $("#id") is a shortcut for document.querySelector.
const $=s=>document.querySelector(s);
// shrink: scales a chosen photo down (max side in px) and re-saves it as a smaller JPEG so the browser storage doesn't fill up.
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");
  c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};i.src=r.result};r.readAsDataURL(f)}
// render: redraws the whole page from the current state. Called after every change.
//   1. sets data-mode / data-skin / data-theme on <body> (this is what the CSS reacts to)
//   2. logged out -> login screen; otherwise header + page + nav + appearance menu
function render(){
  const u=M.me(),app=$("#app");
  document.body.dataset.mode=S.dark?"dark":"light";document.body.dataset.skin=S.skin;
  if(!u){document.body.dataset.theme="none";app.innerHTML=V.auth(S.mode,S.err)+`<div class="authstyle">${V.styleBtn(S)}</div>`+V.styleMenu(S);return}
  if(S.tab==="compose"&&!S.draft)S.tab="text";
  if(S.tab==="popular"&&!S.order)S.order=M.popularPosts().map(p=>p.id); // order is frozen until you reopen the page
  document.body.dataset.theme=NEUTRAL_TABS.includes(S.tab)?"none":(u.current||"none");
  app.innerHTML=V.header(u.current,S.tab,S,u)+`<main>${V.page(S,u)}</main>`+V.nav(S.tab)+V.styleMenu(S)}
// keep(fn): runs fn (usually render) but restores anything typed in a comment box afterwards, so a draft survives a re-render.
const keep=f=>{const m={};document.querySelectorAll("input[id^=c-]").forEach(i=>m[i.id]=i.value);f();for(const k in m){const i=document.getElementById(k);if(i)i.value=m[k]}};
// The public API: everything here can be called from onclick="C.name(...)" in the HTML.
const api={
  // --- appearance ---
  setMode(d){S.dark=d;try{localStorage.setItem("circles-dark",d?"1":"0")}catch(e){}render()},
  skinMenu(){S.skinOpen=!S.skinOpen;render()},
  setSkin(id){S.skin=id;S.skinOpen=false;try{localStorage.setItem("circles-skin",id)}catch(e){}render()},
  // --- direct messages ---
  openDm(id){S.dmWith=id;S.picking=false;S.editing=false;S.tab="thread";M.markSeen(id);render();scrollTo(0,document.body.scrollHeight)},
  newDm(){S.picking=!S.picking;render();if(S.picking){const i=document.getElementById("dmq");i&&i.focus()}},
  dmSearch(v){const r=document.getElementById("dmres");if(r)r.innerHTML=V.pickList(v)},
  sendDm(){const t=$("#dmtxt").value.trim();if(!t)return;M.sendDm(S.dmWith,t);render();$("#dmtxt").focus();scrollTo(0,document.body.scrollHeight)},
  // --- login / sign-up ---
  mode(m){S.mode=m;S.err="";render()},
  async auth(){const n=$("#an").value,p=$("#ap").value;S.err=(S.mode==="in"?await M.logIn(n,p):await M.signUp(n,p))||"";S.tab="text";render()},
  logout(){M.logout();S.editing=false;S.tab="text";S.viewUid=null;render()},
  // go: switch page. Also clears every temporary state (open menus, confirmations, frozen orders) so each page starts clean.
  go(t){S.leaving=null;S.delPost=null;S.cscore={};S.replying=null;S.skinOpen=false;S.dmWith=null;S.picking=false;S.editing=false;S.pic=null;S.showAllHidden=false;S.order=null;S.tab=t;S.viewUid=null;S.draft=null;render()},
  // pick: open hobby h (its Posts page) without joining. join: join and open. joinHere/leaveHere: join/leave from the header and stay on the page.
  pick(h){M.setCurrent(h);S.tab="text";render()},
  join(h){M.join(h);S.tab="text";render()},
  joinHere(h){M.join(h);render()},
  leaveHere(h){if(S.leaving!==h){S.leaving=h;render();return}M.leaveKeep(h);S.leaving=null;render()},
  // leaveAsk -> leave: the two-step "Leave" -> "Confirm leave" in My hobbies.
  leaveAsk(h){S.leaving=h;render()},
  leave(h){M.leave(h);S.leaving=null;render()},
  // --- reactions and comments ---
  vote(id,v){M.vote(id,v);render()},
  hide(id){M.hide(id);render()},
  toggle(id){S.replying=null;S.open[id]=!S.open[id];if(S.cscore)delete S.cscore[id];render()},
  toggleHidden(){S.showHidden=!S.showHidden;render()},
  toggleAllHidden(){S.showAllHidden=!S.showAllHidden;render()},
  // comment: send the text in the single comment box. If S.replying is set it becomes a reply to that comment.
  comment(id){const t=$("#c-"+id).value.trim();if(!t)return;const rt=S.replying&&M.comments(id).some(c=>c.id===S.replying)?S.replying:null;M.comment(id,t,rt);S.replying=null;S.open[id]=true;render()},
  voteC(id,v){M.voteC(id,v);keep(render)},
  // fold: collapse / expand the replies under a comment.
  fold(id){S.folded=S.folded||{};S.folded[id]=!S.folded[id];keep(render)},
  // replyTo: press reply on a comment -> the comment box now answers it (press again to cancel).
  replyTo(id,pid){S.replying=S.replying===id?null:id;keep(render);const i=document.getElementById("c-"+pid);i&&i.focus()},
  // --- writing and editing posts ---
  compose(kind,id){
    const p=id&&M.post(id);if(S.tab!=="compose")S.back=S.tab;
    S.draft=p?{id:p.id,hobby:p.hobby,kind:p.img?"photo":"text",text:p.text,img:p.img}:{id:null,hobby:M.me().current,kind,text:"",img:null};
    S.tab="compose";render()},
  kind(k){S.draft.text=$("#txt").value;S.draft.kind=k;render()},
  cancel(){S.draft=null;S.tab=S.back;render()},
  savePost(){
    const d=S.draft,text=$("#txt").value.trim(),photo=d.kind==="photo",f=photo&&$("#file").files[0];
    const done=img=>{
      if(photo&&!img){toast("Choose a photo first.");return}
      if(!photo&&!text){toast("Write something first.");return}
      M.savePost({...d,text,img});
      S.tab=S.back==="me"?"me":(photo?"photos":"text");S.draft=null;render()};
    f?shrink(f,800,done):done(d.img)},
  // del: two-step delete of one of my posts ("Delete" -> "Confirm delete").
  del(id){if(S.delPost!==id){S.delPost=id;render();return}M.remove(id);S.delPost=null;render()},
  // --- profiles ---
  profile(id){S.editing=false;S.tab="me";S.viewUid=id===M.me().id?null:id;render();scrollTo(0,0)},
  picChosen(input){const f=input.files[0];if(f)shrink(f,240,d=>{S.pic=d;$("#pvw").innerHTML=V.avatar({pic:d,name:"?"},80)})},
  saveProfile(){const err=M.update({name:$("#pn").value,bio:$("#pb").value,...(S.pic?{pic:S.pic}:{})});if(err){toast(err);return}S.pic=null;S.editing=false;render()},
  edit(){S.editing=true;S.pic=null;render()},
  cancelEdit(){S.editing=false;S.pic=null;S.confirmDel=false;S.delErr="";render()},
  // delAsk -> deleteAccount: show the password check, then delete the account for good.
  delAsk(b){S.confirmDel=b;S.delErr="";render()},
  async deleteAccount(){const e=await M.deleteAccount(($("#dpw")||{}).value||"");if(e){S.delErr=e;render();return}S.editing=false;S.confirmDel=false;S.delErr="";S.tab="text";S.viewUid=null;S.mode="in";S.err="";render()}
};
// Escape closes the appearance menu
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.skinOpen){S.skinOpen=false;render()}});
render();
return api})();

</script>
</body>
</html>
